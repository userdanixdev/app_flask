[project]
name = "app-flask"
version = "0.1.0"
description = "Testes com API Flask com Python"
authors = [
    {name = "Daniel"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask-sqlalchemy",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "flask-jwt-extended (>=4.7.4,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
]

[dependency-groups]
dev = [
    "flask (>=3.1.3,<4.0.0)"
]

[tool.pytest.ini_options]
addopts = "-ra -vvv"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
